[project]
name = "clipper"
version = "0.1.0"
description = "Clipping automatique de parties : moments forts, sous-titres, rendu 9:16"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch==2.8.0",
    "torchaudio==2.8.0",
    "faster-whisper>=1.2.0",
    "transformers>=4.56,<5",
    "easyocr>=1.7.2",
    "opencv-python-headless>=4.10",
    "numpy>=2.0",
    "soundfile>=0.12",
    "rapidfuzz>=3.9",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "watchdog>=5.0",
    "pywebview>=5.3",
    "pydantic>=2.8",
    "hf-xet>=1.1",
]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
